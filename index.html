.app[data-scene="2"] .thought-text{font-size:clamp(16px,2.15vw,23px);line-height:1.5}
.app[data-scene="2"] .story-card .eyebrow,.app[data-scene="2"] .story-card .message,.app[data-scene="2"] .story-card .subtext{display:none}
.app[data-scene="2"] .story-card{display:block;width:auto;min-width:min(360px,86vw);max-height:none;padding:15px 20px 18px}

.app[data-scene="3"] .pomegranate-couple{opacity:0}
@keyframes pomegranateFloat{0%,100%{transform:translateX(-50%) translateY(0) rotate(0)}50%{transform:translateX(-50%) translateY(-5px) rotate(-.35deg)}}
@media(max-width:650px){
 .app[data-scene="2"] .pomegranate-couple{height:72%;max-width:98%}
 .app[data-scene="2"] .thought-cloud{top:-8%;width:88vw;min-height:108px;padding:14px 17px}
 .app[data-scene="2"] .thought-text{font-size:clamp(16px,4vw,19px);line-height:1.45}
}
@media(max-height:700px){.app[data-scene="2"] .pomegranate-couple{height:69%}.app[data-scene="2"] .thought-cloud{top:-13%;padding:10px 16px}}
</style>

<body>
<main class="app" id="app" data-scene="0" aria-live="off">
  <div class="ambient"><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div></div>
  <div class="specks" id="specks" aria-hidden="true"></div>
  <header class="topbar"><div class="brand"><span class="heart">♡</span> just us, always.</div><div class="utility"><button class="circle-btn" id="audioBtn" title="تشغيل الموسيقى" aria-label="تشغيل الموسيقى">♫</button><button class="circle-btn" id="restartBtn" title="ابدأ من الأول" aria-label="ابدأ من الأول">↻</button></div></header>
  <div class="scene-number"><span id="sceneLabel">01 / 04</span><div class="progress" id="progress" aria-label="تقدم الحكاية"></div></div>
  <button class="back" id="backBtn" aria-label="المشهد السابق" title="السابق">‹</button>
  <div class="scene-container scene-enter" id="content">
    <h1 class="scene-title" id="sceneTitle"></h1>
    <div class="stage" id="stage" aria-label="رسوم متحركة لشخصيتين مستوحاتين من الصور">
      <div class="halo"></div><div class="window"></div><div class="couch"></div><span class="plant">🌿</span>
      <span class="tiny-star a">✧</span><span class="tiny-star b">✦</span><span class="tiny-star c">✧</span>
      <div class="character girl" id="girl"><img class="happy" src="assets/character_1.webp" alt="شخصية كرتونية لطيفة للبنت بحجاب فاتح وبلوزة بنية" draggable="false" /><img class="upset" src="assets/character_2.webp" alt="" aria-hidden="true" draggable="false" /></div>
      <div class="character boy" id="boy"><img class="happy" src="assets/character_3.webp" alt="شخصية كرتونية لطيفة للولد بنظارة ولحية وتيشيرت أبيض" draggable="false" /><img class="upset" src="assets/character_4.webp" alt="" aria-hidden="true" draggable="false" /></div>

      <div class="final-couple" id="finalCouple"><img src="assets/character_5.webp" alt="إنتوا ماسكين إيد بعض وبتبصوا لبعض بحب" draggable="false" /></div>
      <div class="talking-couple" aria-hidden="true"><img src="assets/character_6.webp" alt="" draggable="false"></div>
      <div class="pomegranate-couple" aria-label="إنتِ بتقدمي طبق رمان وهو بيضحك ومنبهر"><img src="assets/character_7.webp" alt="البنت بتقدم طبق مليان حبوب رمان حمراء والولد بيضحك وإيده على وشه" draggable="false"></div>
      <div class="thought-cloud" id="thoughtCloud"><span class="thought-text" id="thoughtText"></span></div><span class="glow-heart">💗</span><div id="bursts" aria-hidden="true"></div>
    </div>
    <section class="story-card" id="card" aria-live="polite"><p class="eyebrow" id="eyebrow"></p><div class="message" id="message"></div><div class="subtext" id="subtext"></div><div class="actions" id="actions"></div></section>
  </div>
  <div id="reaction" aria-live="polite"></div>
  <div class="footer-note">made with all my love ♡</div>
</main>
<script>
(()=>{
'use strict';
const scenes=[
 {title:'',message:'',button:'عايزة اقول حاجه'},
 {title:'',message:'حاسه ان الدنيا بينا متنشنه الفتره دي و كنت عايزه افكرك اني بحبك يا لولو و مهما اتخانقنا هفضل علي قلبك',button:'المهم'},
 {title:'',message:'اني مستنيه اليوم الي هفرط في الرمان في شقتي الي هاخده ب التمكين 😈🤍',button:'نعتبر اننا اتصالحنا'},
 {title:'',message:'',final:true}
];
const $=id=>document.getElementById(id),app=$('app'),content=$('content'),actions=$('actions'),burstLayer=$('bursts');
let current=0,transitioning=false,typeTimer=null,burstTimer=null,typingId=0;
const particles=['♡','✦','·','♡','✧','·','♡','✦','·','♡','✧','♡','·','✦'];
$('specks').innerHTML=particles.map((p,i)=>`<span class="speck" style="--x:${(i*43+13)%97}%;--y:${(i*37+8)%89}%;--duration:${7+i%6}s;--delay:${-i*.81}s;--size:${10+i%4*5}px">${p}</span>`).join('');
function typeThought(text){clearInterval(typeTimer);let n=0;const id=++typingId;const chars=Array.from(text);const el=$('thoughtText');el.textContent='';const tick=()=>{if(id!==typingId)return;n=Math.min(n+1,chars.length);el.textContent=chars.slice(0,n).join('');if(n===chars.length)clearInterval(typeTimer)};tick();typeTimer=setInterval(tick,45)}
function draw(){
 const s=scenes[current];app.dataset.scene=String(current);
 content.className='scene-container scene-enter';
 $('sceneLabel').textContent=String(current+1).padStart(2,'0')+' / 04';
 $('progress').innerHTML=scenes.map((_,i)=>`<span class="${i<=current?'active':''}"></span>`).join('');
 $('backBtn').disabled=current===0;
 $('sceneTitle').textContent=current===3?'good morning ashroofyy i love u baby':'';
 $('eyebrow').textContent='';$('message').textContent='';$('subtext').textContent='';
 if(current===1||current===2)typeThought(s.message);else{clearInterval(typeTimer);$('thoughtText').textContent=''}
 actions.replaceChildren();
 if(!s.final){const btn=document.createElement('button');btn.className='primary';btn.textContent=s.button;btn.onclick=()=>go(current+1);actions.append(btn)}
 if(current===3){setTimeout(()=>heartStorm(26),540);burstTimer=setInterval(()=>heartStorm(22),3100)}
}
function clearReaction(){clearInterval(burstTimer);burstLayer.replaceChildren()}
function go(next){if(transitioning||next<0||next>=scenes.length)return;transitioning=true;clearReaction();content.classList.remove('scene-enter');content.classList.add('scene-exit');setTimeout(()=>{current=next;draw();transitioning=false},400)}
$('backBtn').onclick=()=>go(current-1);
$('restartBtn').onclick=()=>{if(current!==0)go(0);else{clearReaction();draw()}};
function heartStorm(count=19){burstLayer.replaceChildren();for(let i=0;i<count;i++){const heart=document.createElement('span');heart.className='heart-burst';heart.textContent=['♡','♥','♡','♥'][i%4];heart.style.color=['#ef8daa','#d880a4','#f4b0be'][i%3];heart.style.setProperty('--dx',`${(Math.random()-.5)*450}px`);heart.style.setProperty('--dy',`${-60-Math.random()*235}px`);heart.style.left=`${35+Math.random()*30}%`;heart.style.bottom=`${15+Math.random()*35}%`;heart.style.animationDelay=`${Math.random()*.7}s`;heart.style.fontSize=`${17+Math.random()*25}px`;burstLayer.appendChild(heart)}}
document.addEventListener('keydown',e=>{if(e.target.closest('button'))return;if(e.key==='ArrowLeft'&&current<3)go(current+1);if(e.key==='ArrowRight'&&current>0)go(current-1)});
// An ORIGINAL, gently synthesized music-box melody. No audio file or third-party music required.
let ctx=null,musicOn=false,musicTimer=null,noteIndex=0;const melody=[0,4,7,12,7,4,2,5,9,12,9,5,0,4,7,11,7,4,-2,2,5,9,5,2];const base=261.63;
function playNote(){if(!musicOn||!ctx)return;const n=melody[noteIndex++%melody.length];const freq=base*Math.pow(2,n/12);const osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();osc.type='sine';osc.frequency.value=freq;filter.type='lowpass';filter.frequency.value=1500;const now=ctx.currentTime;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.065,now+.022);gain.gain.exponentialRampToValueAtTime(.0001,now+.73);osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+.76)}
$('audioBtn').onclick=async()=>{try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();musicOn=!musicOn;if(musicOn){noteIndex=0;playNote();musicTimer=setInterval(playNote,430);$('audioBtn').textContent='♫';$('audioBtn').style.background='#f6d6e4';$('audioBtn').title='إيقاف الموسيقى';$('audioBtn').setAttribute('aria-label','إيقاف الموسيقى')}else{clearInterval(musicTimer);$('audioBtn').textContent='♪̸';$('audioBtn').style.background='';$('audioBtn').title='تشغيل الموسيقى';$('audioBtn').setAttribute('aria-label','تشغيل الموسيقى')}}catch(e){alert('المتصفح مش بيسمح بتشغيل الصوت على الجهاز ده.')}};
window.addEventListener('pagehide',()=>{clearInterval(musicTimer);clearInterval(burstTimer);clearInterval(typeTimer);ctx?.close()});draw();
})();
</script>
</body>
